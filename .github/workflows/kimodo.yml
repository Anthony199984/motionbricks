name: Kimodo CPU

on:
  push:
    branches: [kimodo-jobs]
    paths: ["kimodo_jobs/**", ".github/workflows/kimodo.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kimodo
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
      NSHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Liberar disco
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/kimodo_log.txt") 2>&1; date
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Descargar kimodo.cpp
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/kimodo_log.txt") 2>&1; date
          git clone https://github.com/localai-org/kimodo.cpp kcpp
          cd kcpp && git checkout ed8a931aedb132f768190f6931c365855caba74c
          git submodule update --init --recursive

      - name: Compilar (CPU)
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/kimodo_log.txt") 2>&1; date
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build g++-14
          cd kcpp
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14 \
                -DKIMODO_ENABLE_VULKAN=OFF -DKIMODO_BUILD_TESTS=OFF -DGGML_NATIVE=ON
          cmake --build build --target kmd-generate -j 4
          find build -name kmd-generate -type f

      - name: Pesos (cache)
        id: cache
        uses: actions/cache@v4
        with:
          path: weights
          key: kimodo-soma-rp-v1.1-q8_0-v2

      - name: Descargar pesos
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/kimodo_log.txt") 2>&1; date
          pip install -q huggingface_hub
          bash kcpp/scripts/download_gguf_weights.sh --output "$PWD/weights" --model soma-rp-v1.1 --motion-only
          echo "--- manifiesto del texto ---"
          hf download LocalAI-io/Llama-3-Kimodo-GGML --include MANIFEST.json --local-dir weights/text_manifest
          head -c 3000 weights/text_manifest/MANIFEST.json; echo
          echo "--- archivos del repo de texto ---"
          python3 -c "from huggingface_hub import list_repo_files as l; [print(f) for f in l('LocalAI-io/Llama-3-Kimodo-GGML')]"
          hf download LocalAI-io/Llama-3-Kimodo-GGML Llama-3-Kimodo-Q8_0.gguf tokenizer.gguf --local-dir weights
          find weights -name "*.gguf" -exec ls -la {} \;
          Q8=$(find weights -name "Llama-3-Kimodo-Q8_0.gguf" | head -1)
          TOK=$(find weights -name "tokenizer.gguf" | head -1)
          [ -f "$(dirname "$Q8")/tokenizer.gguf" ] || cp "$TOK" "$(dirname "$Q8")/tokenizer.gguf"
          du -sh weights

      - name: Generar animaciones
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/kimodo_log.txt") 2>&1; date
          GEN=$(find kcpp/build -name kmd-generate -type f | head -1)
          TEXT=$(find weights -name "Llama-3-Kimodo-Q8_0.gguf" | head -1)
          MOTION=$(find weights -name "kimodo-soma-rp-v1.1-f32.gguf" | head -1)
          echo "gen=$GEN text=$TEXT motion=$MOTION"; free -g; nproc
          python3 kimodo_jobs/run_jobs.py "$GEN" "$MOTION" "$TEXT" out

      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          mkdir -p kimodo_out && cp -r out/. kimodo_out/ 2>/dev/null || true
          git config user.name "kimodo-bot"; git config user.email "actions@users.noreply.github.com"
          git add kimodo_out
          git commit -m "Resultados Kimodo parte ${SHARD} [skip ci]" || echo "nada que guardar"
          cp kimodo_log.txt "kimodo_out/kimodo_log_${SHARD}.txt" 2>/dev/null || true; git add kimodo_out; git commit --amend --no-edit -q || true
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase -q origin kimodo-jobs && git push origin HEAD:kimodo-jobs && break
            sleep $((RANDOM % 20 + 5))
          done
