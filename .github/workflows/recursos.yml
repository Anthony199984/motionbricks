name: Recursos CC0

on:
  push:
    branches: [recursos]
    paths: ["recursos/pedido.json", "recursos/bajar.py", ".github/workflows/recursos.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recursos
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bajar recursos del pedido
        run: python3 recursos/bajar.py
      - name: Subir resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/out
          git commit -m "Recursos bajados [skip ci]" || echo "nada nuevo"
          git pull --rebase origin recursos || true
          git push origin HEAD:recursos
