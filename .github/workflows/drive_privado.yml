name: Drive privado

# Baja archivos de Google Drive (compartidos con enlace) y los sube CIFRADOS (AES-256 con una llave aleatoria que solo
# se puede abrir con la llave privada de Claude): en el repositorio público queda solo texto cifrado.
on:
  push:
    branches: [recursos]
    paths: ["recursos/drive_pedido.json", ".github/workflows/drive_privado.yml"]

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bajar de Drive
        run: |
          mkdir -p drive_out
          python3 - <<'PY'
          import json, urllib.request, os, time
          p = json.load(open("recursos/drive_pedido.json"))
          for it in p["archivos"]:
              url = f"https://drive.usercontent.google.com/download?id={it['id']}&export=download&confirm=t"
              for k in range(4):
                  try:
                      d = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=300).read()
                      break
                  except Exception as e:
                      print("reintento", it["nombre"], e); time.sleep(5 * (k + 1))
              open(os.path.join("drive_out", it["nombre"]), "wb").write(d)
              print(it["nombre"], len(d), d[:4])
          PY
          ls -la drive_out; sha256sum drive_out/*
      - name: Cifrar y subir
        run: |
          mkdir -p recursos/privado
          openssl rand -hex 32 > clave.txt
          tar -cf - -C drive_out . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:clave.txt | split -b 80m - recursos/privado/datos.enc.
          openssl pkeyutl -encrypt -pubin -inkey recursos/drive_pub.pem -in clave.txt -out recursos/privado/clave.enc
          rm -f clave.txt; rm -rf drive_out
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/privado; git commit -m "Paquete cifrado de Drive [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin recursos && git push origin HEAD:recursos && break; sleep 10; done
